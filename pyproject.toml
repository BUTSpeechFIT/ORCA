[project]
name = "orca-score"
version = "0.1.0"
description = "ORCA: Open-ended Response Correctness Assessment for Audio QAs"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Bolaji Yusuf"},
    {name = "Santosh Kesiraju"},
    {name = "Šimon Sedláček"}
]

license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# scoring only; the published models are downloaded from Hugging Face on first use
dependencies = [
    "torch",
    "transformers==4.57.1",  # works with offline models and tokenizers
    "accelerate==1.12.0",
    "peft",
    "huggingface_hub",
    "numpy",
    "scipy",
    "pyyaml",
    "tqdm",
]

[project.urls]
Paper = "https://doi.org/10.1162/TACL.a.798"
Repository = "https://github.com/BUTSpeechFIT/ORCA"
Dataset = "https://huggingface.co/datasets/BUT-FIT/orca-audio-qa-annotations"

[project.optional-dependencies]
train = [
    "datasets",
    "rich",
    "tensorboard",
    "scikit-learn",
    "bitsandbytes",
]
webapp = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest",
    "black",
    "ruff",
    "isort",
    "ipdb",
    "ipython",
    "huggingface_hub[cli]",
    "pre-commit",
    "matplotlib",
    "ipykernel",
    "requests",
]

[project.scripts]
orca-train = "orca_score.cli:orca_train"
orca-score = "orca_score.cli:orca_score_cmd"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orca_score"]

[tool.hatch.build.targets.sdist]
include = ["orca_score", "README.md", "LICENSE", "pyproject.toml"]
